<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Desk</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead"><span class="eyebrow">DOC PROCESS RAG</span><h1>Document Desk</h1><p>Grounded answers from the sources you select.</p></header>
      <section class="workspace">
        <aside class="sources panel"><div class="panel-heading"><h2>Sources</h2><span id="source-count">0</span></div>
          <form id="upload-form"><label class="dropzone" for="file-input"><strong>Drop a PDF or Markdown file</strong><span>or browse from your device</span><input id="file-input" type="file" accept=".pdf,.md,.markdown" /></label><button type="submit">Upload document</button></form>
          <form id="url-form" class="url-form"><label for="url-input">Add a web source</label><div class="url-row"><input id="url-input" type="url" placeholder="https://example.com/article" required /><button type="submit">Add</button></div></form>
          <div id="source-list" class="source-list"></div>
        </aside>
        <section class="chat panel"><div class="chat-heading"><div><span class="eyebrow">EVIDENCE FIRST</span><h2>Ask your documents</h2></div><span class="status-dot">RAG</span></div><div id="readiness" class="readiness">Select a ready document to enable questions.</div><div id="message-list" class="chat-space"><p>Upload a source, wait for Ready, then ask a question.</p></div><form id="chat-form" class="chat-form"><input id="chat-input" disabled placeholder="Ask a question about the selected sources" /><button id="ask-button" disabled>Ask</button></form></section>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="app.js?v=20260913-2"></script>
  </body>
</html>
