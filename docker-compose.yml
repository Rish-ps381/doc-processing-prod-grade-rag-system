services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  weaviate:
    image: semitechnologies/weaviate:1.27.6
    ports: ["8081:8080"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
    volumes: [weaviate_data:/var/lib/weaviate]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [mongodb, redis, weaviate]
  frontend:
    image: nginx:1.27-alpine
    ports: ["5173:80"]
    volumes: ["./frontend:/usr/share/nginx/html:ro"]
    depends_on: [backend]
volumes:
  mongo_data:
  weaviate_data: